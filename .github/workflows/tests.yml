name: Tests
run-name: "Tests - ${{ github.ref_name }} - ${{ github.event_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Contract Fixture Changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No comparable base SHA; skipping contract fixture diff check."
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${GITHUB_SHA}")"
          echo "${changed_files}"

          if ! grep -q '^tests/fixtures/contracts/' <<< "${changed_files}"; then
            echo "No contract fixture changes detected."
            exit 0
          fi

          echo "Contract fixture changes detected; verifying companion updates."

          if ! grep -Eq '^(docs/CONTRACTS\.md|adr/0030-machine-readable-contract-surface\.md|CONTRIBUTING\.md)$' <<< "${changed_files}"; then
            echo "Contract fixture changes require matching updates to docs/CONTRACTS.md, adr/0030-machine-readable-contract-surface.md, or CONTRIBUTING.md."
            exit 1
          fi

          if ! grep -Eq '^tests/test_contract_' <<< "${changed_files}"; then
            echo "Contract fixture changes require matching updates to contract tests."
            exit 1
          fi

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
