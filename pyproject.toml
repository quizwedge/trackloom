[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackloom"
version = "0.1.0"
description = "CLI to compare audio files across two directories"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
  "mutagen>=1.47.0",
  "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.0 ; python_version >= '3.11'",
  "pre-commit>=2.20.0,<3.0.0 ; python_version < '3.11'",
  "ruff>=0.5.0",
]

[project.scripts]
trackloom = "trackloom.cli:main"

[tool.setuptools]
packages = ["trackloom", "trackloom.commands"]
license-files = ["LICENSE"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "PTH", "DTZ", "TRY"]
ignore = ["TRY003", "TRY004", "TRY300"]
